<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="./styles.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- script principal -->
    <script type="module" src="./main.js"></script>

    <title>Gestor de tareas</title>
</head>

<body class="bg-dark">
    <nav>
        Aqui va el navbar
    </nav>
    <main class="d-flex justify-content-center mt-3 bg-dark ">
        <form class="card w-50 mt-50 p-4 bg-dark shadow">
            <section id="title">
                <h1> Agrega tarea diaria: </h1>
            </section>
            <section id="task_title" class="shadow">
                <div class="form-floating mb-3 shadow">
                    <input type="text" class="form-control" id="task_title_input" placeholder="">
                    <label for="task_title_input" class="p-2">¿Nombra la tarea para hoy?</label>
                </div>
            </section>
            <section id="task_descr">
                <div class="form-floating">
                    <textarea class="form-control" placeholder=""
                        id="task_text_area" style="height: 100px"></textarea>
                    <label for="task_text_area" class="p-2">Añade la descripción o notas de la tarea:</label>
                </div>
            </section>
        </form>
    </main>

    <!-- script bootstrap -->
    `
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
