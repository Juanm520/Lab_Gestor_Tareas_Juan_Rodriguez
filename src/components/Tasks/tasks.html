<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!-- Estilos propios -->
<link rel="stylesheet" href="../../styles.css">
<!-- script principal -->
<script type="module" src="./tasks_controller.js"></script>


<body>
    <main>

        <article class="d-flex  p-4">

            <div class="row g-3 w-100 flex-wrap gap-2">

                <div class="col-12 col-md-4 col-xl-3 border rounded text-success tasks-side-column">
                    <div class="h-100 p-3">
                        <div class="mb-4">
                            <h5 id="too_latest_title" class="fw-bold"></h5>
                            <small class="">Tareas de Antier.</small>
                        </div>
                        <!-- tareas muy pasadas -->
                        <div id="too_latest_tasks"></div>

                    </div>
                </div>

                <div class="col-12 col-md-4 col-xl-3 border rounded text-success tasks-side-column">
                    <div class="d-flex flex-column h-100 p-3">
                        <div class="mb-4">
                            <h5 id="latest_title" class="fw-bold"></h5>
                            <small class="">Tareas de ayer.</small>
                        </div>
                        <!-- tareas pasadas -->
                        <div id="latest_tasks"></div>

                    </div>
                </div>

                <div class="col-12 col-md-8 col-xl-5 order-first order-md-last border rounded active_tasks tasks-today-column">
                    <div class="d-flex flex-column p-3">
                        <div class="mb-4">
                            <h5 id="today_title" class="fw-bold"></h5>
                            <small class="">Tareas activas para hoy.</small>
                        </div>
                        <!-- tareas actuales -->
                        <div id="today_tasks" class="d-flex flex-column gap-2 w-100"></div>

                    </div>
                </div>



            </div>
        </article>
    </main>
</body>
