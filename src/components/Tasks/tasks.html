<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!-- Estilos propios -->
<link rel="stylesheet" href="../../styles.css">
<!-- script principal -->
<script type="module" src="./tasks_controller.js"></script>


<body>
    <main>

        <article class="d-flex p-4 align-items-center flex-column gap-4 w-100">
            <button type="button" class="btn btn-secondary btn-lg">Agrega la tarea que debes finalizar ¡HOY!</button>
            <div class="row g-3 w-100 align-items-stretch justify-content-center gap-2">

                <div class="col-12 col-lg-4 order-2 order-lg-1 border rounded text-success inactive_tasks h-100">
                    <div class="d-flex flex-column h-100 p-3">
                        <div class="mb-4">
                            <h5 id="latest_title" class="fw-bold"></h5>
                            <small class="">Tareas de ayer.</small>
                        </div>
                        <!-- tareas pasadas -->
                        <div id="latest_tasks"></div>

                    </div>
                </div>

                <div class="col-12 col-lg-8 order-1 order-lg-2 border rounded active_tasks h-100">
                    <div class="d-flex flex-column h-100 p-3">
                        <div class="mb-4">
                            <h5 id="today_title" class="fw-bold"></h5>
                            <small class="">Tareas activas para hoy.</small>
                        </div>
                        <!-- tareas actuales -->
                        <div id="today_tasks" class="d-flex flex-column gap-2 w-100"></div>

                    </div>
                </div>

            </div>
        </article>
    </main>
</body>
